name: promote
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy main
        type: choice
        options: [sandbox, production]
        required: true
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.target == 'production' && vars.PAGES_PRODUCTION || vars.PAGES_SANDBOX }} --branch=main